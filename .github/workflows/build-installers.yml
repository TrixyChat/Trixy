name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Build DMG
        run: bash ./scripts/build-macos-installer.sh

      - name: Verify DMG
        run: |
          echo "Contents of dist:"
          ls -lah dist
          DMG="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG was produced."
            exit 1
          fi
          echo "DMG produced: $DMG"
          hdiutil verify "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: trixy-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: rustup update stable; rustup default stable

      - name: Install packager
        shell: pwsh
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build Windows installer
        shell: pwsh
        run: cargo packager --release --formats nsis

      - uses: actions/upload-artifact@v4
        with:
          name: trixy-windows
          path: dist/*
          
