name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build DMG
        run: cargo packager --release --formats app dmg
      - uses: actions/upload-artifact@v4
        with:
          name: trixy-macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: pwsh
        run: rustup update stable; rustup default stable
      - name: Install packager
        shell: pwsh
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build Windows installer
        shell: pwsh
        run: cargo packager --release --formats nsis
      - uses: actions/upload-artifact@v4
        with:
          name: trixy-windows
          path: dist/*
